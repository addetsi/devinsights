source: github
api:
  base_url: https://api.github.com
  auth: token # uses GITHUB_TOKEN from environment/key vault

kafka:
  topic: github-events
  bootstrap_servers: localhost:9092

repositories:
  - dbt-labs/dbt-core
  - apache/kafka
  - streamlit/streamlit
  - hashicorp/terraform
  - pallets/flask
  - fastapi/fastapi
  - microsoft/vscode
  - facebook/react
  - langchain-ai/langchain
  - openai/openai-python
  - pandas-dev/pandas
  - kubernetes/kubernetes
  - tensorflow/tensorflow
  - pytorch/pytorch
  - numpy/numpy
  - scipy/scipy
  - scikit-learn/scikit-learn
  - matplotlib/matplotlib
  - psf/requests
  - django/django
  - encode/django-rest-framework
  - tiangolo/sqlmodel
  - sqlalchemy/sqlalchemy
  - pydantic/pydantic
  - pytest-dev/pytest
  - astral-sh/ruff
  - astral-sh/uv
  - python-poetry/poetry
  - ansible/ansible
  - celery/celery
  - apache/airflow
  - prefecthq/prefect
  - dagster-io/dagster
  - scrapy/scrapy
  - huggingface/transformers
  - huggingface/datasets
  - lightning-ai/pytorch-lightning
  - keras-team/keras
  - opencv/opencv
  - apache/spark
  - apache/flink
  - apache/beam
  - elastic/elasticsearch
  - opensearch-project/OpenSearch
  - redis/redis
  - mongodb/mongo
  - postgres/postgres
  - ClickHouse/ClickHouse
  - duckdb/duckdb
  - grafana/grafana
  - prometheus/prometheus
  - jaegertracing/jaeger
  - open-telemetry/opentelemetry-collector
  - docker/compose
  - containerd/containerd
  - helm/helm
  - istio/istio
  - argoproj/argo-cd
  - fluxcd/flux2
  - hashicorp/vault
  - hashicorp/consul
  - pulumi/pulumi
  - opentofu/opentofu
  - nginx/nginx
  - caddyserver/caddy
  - traefik/traefik
  - curl/curl
  - git/git
  - torvalds/linux
  - llvm/llvm-project
  - rust-lang/rust
  - golang/go
  - nodejs/node
  - denoland/deno
  - oven-sh/bun
  - microsoft/TypeScript
  - vercel/next.js
  - vuejs/core
  - angular/angular
  - sveltejs/svelte
  - remix-run/react-router
