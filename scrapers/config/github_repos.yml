  - eslint/eslint
  - prettier/prettier
  - tailwindlabs/tailwindcss
  - mui/material-ui
  - electron/electron
  - tauri-apps/tauri
  - flutter/flutter
  - dotnet/runtime
  - spring-projects/spring-boot
  - rails/rails
  - laravel/framework
