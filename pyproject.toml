[project]
name = "devinsights"
version = "0.1.0"
description = "Personal DevOps analytics platform on Azure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports/vars, undefined names)
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = false
[[tool.mypy.overrides]]
module = ["dotenv", "confluent_kafka"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "responses>=0.26.2",
    "ruff>=0.16.2",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260724",
    "types-requests>=2.33.0.20260712",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scrapers/tests", "consumer/tests"]

[[tool.mypy.overrides]]
module = ["scrapers.tests.*", "consumer.tests.*"]
disallow_untyped_decorators = false
