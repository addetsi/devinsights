version: 2

models:
  - name: silver_repos
    description: "Deduplicated, typed repository metadata (latest snapshot per repo)"
    columns:
      - name: repo
        description: "Full repo name (owner/name)"
        tests:
          - not_null
          - unique
      - name: stars
        description: "Star count"
        tests:
          - not_null
      - name: default_branch
        tests:
          - not_null

  - name: silver_pull_requests
    description: "Deduplicated, typed pull request data (latest snapshot per PR)"
    columns:
      - name: pr_number
        tests:
          - not_null
      - name: state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'closed']
  - name: silver_commits
    description: "Deduplicated commit data (latest snapshot per commit sha)"
    columns:
      - name: sha
        tests: [not_null]
      - name: repo
        tests: [not_null]

  - name: silver_releases
    description: "Deduplicated release data (latest snapshot per release)"
    columns:
      - name: release_id
        tests: [not_null]
      - name: repo
        tests: [not_null]

  - name: silver_branch_protection
    description: "Branch protection settings per repo (sparse — many repos inaccessible)"
    columns:
      - name: repo
        tests: [not_null, unique]
